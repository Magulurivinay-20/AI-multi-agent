spring.application.name=backend

# Database — production values must be provided by environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_multi_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate — auto-create/update tables (safe for production with managed DB)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool — important for cloud DB with idle timeouts
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

server.port=${PORT:9090}

# Gemini API key
gemini.api.key=${GEMINI_API_KEY:}

# CORS — set to your Vercel frontend URL in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
