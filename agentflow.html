<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentFlow AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { margin: 0; padding: 0; }

    .btn-primary {
      background: linear-gradient(135deg, #1E6FFF 0%, #0B50CC 100%);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3D84FF 0%, #1E6FFF 100%);
      box-shadow: 0 4px 20px rgba(30,111,255,0.4);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: #F4F8FF;
      border: 1.5px solid #D8E4F5;
      color: #0B1E3F;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field::placeholder { color: #7A90B3; }
    .input-field:focus {
      border-color: #1E6FFF;
      box-shadow: 0 0 0 3px rgba(30,111,255,0.12);
    }
    .input-field.error { border-color: #FF4D6A; background: rgba(255,77,106,0.04); }
    .input-field.success { border-color: #22C55E; background: rgba(34,197,94,0.04); }

    .tab-active { box-shadow: 0 2px 12px rgba(30,111,255,0.2); }

    .strength-bar { transition: width 0.35s ease, background-color 0.35s ease; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-animate { animation: slideUp 0.4s ease forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.25s ease forwards; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.4s ease; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0B1E3F; }
    ::-webkit-scrollbar-thumb { background: #1E6FFF; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

/* ─── In-memory user store ─────────────────────────────────── */
const SEED_USERS = [
  {
    username: 'demo@agentflow.ai',
    fullName: 'Demo User',
    dob: '1990-01-01',
    email: 'demo@agentflow.ai',
    mobile: '+1 555-000-0000',
    password: 'Demo1234!',
  },
];

/* ─── Password strength ────────────────────────────────────── */
function getStrength(pw) {
  if (!pw) return 0;
  let s = 0;
  if (pw.length >= 8) s++;
  if (/[A-Z]/.test(pw)) s++;
  if (/[0-9]/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  return s;
}
const STRENGTH_META = [
  { label: '',        color: '#D8E4F5' },
  { label: 'Weak',   color: '#FF4D6A' },
  { label: 'Fair',   color: '#FF8C42' },
  { label: 'Good',   color: '#F5C518' },
  { label: 'Strong', color: '#22C55E' },
];

function PasswordStrengthBar({ password }) {
  const score = getStrength(password);
  const meta  = STRENGTH_META[score];
  const pct   = password ? (score / 4) * 100 : 0;
  return (
    <div style={{ marginTop: 6 }}>
      <div style={{ width: '100%', height: 6, borderRadius: 99, background: '#D8E4F5', overflow: 'hidden' }}>
        <div className="strength-bar" style={{ height: '100%', borderRadius: 99, width: `${pct}%`, background: meta.color }} />
      </div>
      {password && (
        <p style={{ color: meta.color, fontSize: 12, marginTop: 4, fontWeight: 600 }}>{meta.label}</p>
      )}
    </div>
  );
}

/* ─── Error banner ─────────────────────────────────────────── */
function ErrorBanner({ message, shakeKey }) {
  if (!message) return null;
  return (
    <div key={shakeKey} className="fade-in shake" style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: 'rgba(255,77,106,0.1)', border: '1px solid rgba(255,77,106,0.3)',
      color: '#FF4D6A', borderRadius: 10, padding: '10px 14px', fontSize: 13,
    }}>
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style={{ flexShrink: 0 }}>
        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"/>
      </svg>
      {message}
    </div>
  );
}

/* ─── Spinner ──────────────────────────────────────────────── */
function Spinner() {
  return (
    <svg className="spin" width="16" height="16" fill="none" viewBox="0 0 24 24" style={{ display: 'inline-block' }}>
      <circle style={{ opacity: 0.25 }} cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
      <path style={{ opacity: 0.75 }} fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
    </svg>
  );
}

/* ─── Login Form ───────────────────────────────────────────── */
function LoginForm({ onLogin, onSwitch, userStore }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError]       = useState('');
  const [shake, setShake]       = useState(0);
  const [loading, setLoading]   = useState(false);

  const fail = (msg) => { setError(msg); setShake(k => k + 1); };

  const submit = (e) => {
    e.preventDefault();
    setError('');
    if (!username.trim() || !password.trim()) { fail('Please fill in all fields.'); return; }
    const user = userStore.find(u => u.username.toLowerCase() === username.trim().toLowerCase());
    if (!user || user.password !== password) { fail('Incorrect username or password.'); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(user); }, 600);
  };

  const label = { display: 'block', fontSize: 13, fontWeight: 600, color: '#0B1E3F', marginBottom: 6 };

  return (
    <form onSubmit={submit} noValidate style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div>
        <label style={label}>Username</label>
        <input className="input-field" type="text" value={username} onChange={e=>setUsername(e.target.value)}
          placeholder="Enter your username" autoComplete="username" />
      </div>
      <div>
        <label style={label}>Password</label>
        <input className="input-field" type="password" value={password} onChange={e=>setPassword(e.target.value)}
          placeholder="Enter your password" autoComplete="current-password" />
      </div>

      <ErrorBanner message={error} shakeKey={shake} />

      <button type="submit" disabled={loading} className="btn-primary" style={{
        width: '100%', padding: '13px 0', borderRadius: 12, color: '#fff',
        fontWeight: 700, fontSize: 14, border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      }}>
        {loading ? <><Spinner /> Signing in…</> : 'Sign In'}
      </button>

      <p style={{ textAlign: 'center', fontSize: 13, color: '#7A90B3', margin: 0 }}>
        Don't have an account?{' '}
        <button type="button" onClick={() => onSwitch('signup')} style={{
          background: 'none', border: 'none', color: '#1E6FFF', fontWeight: 700,
          cursor: 'pointer', padding: 0, fontSize: 13, textDecoration: 'underline',
        }}>Create one</button>
      </p>
    </form>
  );
}

/* ─── Signup Form ──────────────────────────────────────────── */
function SignupForm({ onSignup, onSwitch, userStore }) {
  const today = new Date().toISOString().split('T')[0];
  const [form, setForm] = useState({
    fullName: '', dob: '', email: '', mobile: '', password: '', confirm: '',
  });
  const [error, setError]   = useState('');
  const [shake, setShake]   = useState(0);
  const [loading, setLoading] = useState(false);

  const set = k => e => setForm(p => ({ ...p, [k]: e.target.value }));
  const fail = msg => { setError(msg); setShake(k => k + 1); };

  const submit = (e) => {
    e.preventDefault();
    setError('');
    const { fullName, dob, email, mobile, password, confirm } = form;
    if (!fullName.trim() || !dob || !email.trim() || !mobile.trim() || !password || !confirm)
      { fail('All fields are required.'); return; }
    if (password.length < 8) { fail('Password must be at least 8 characters.'); return; }
    if (password !== confirm) { fail('Passwords do not match.'); return; }
    if (userStore.find(u => u.email.toLowerCase() === email.trim().toLowerCase()))
      { fail('An account with this email already exists.'); return; }

    setLoading(true);
    const newUser = {
      username: email.trim(), fullName: fullName.trim(), dob,
      email: email.trim(), mobile: mobile.trim(), password,
    };
    setTimeout(() => { setLoading(false); onSignup(newUser); }, 700);
  };

  const label = { display: 'block', fontSize: 13, fontWeight: 600, color: '#0B1E3F', marginBottom: 6 };
  const confirmState = form.confirm
    ? form.confirm === form.password ? 'success' : 'error'
    : '';

  return (
    <form onSubmit={submit} noValidate style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

      {/* Full name + DOB row */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <label style={label}>Full Name</label>
          <input className="input-field" type="text" value={form.fullName} onChange={set('fullName')}
            placeholder="Jane Doe" autoComplete="name" />
        </div>
        <div>
          <label style={label}>Date of Birth</label>
          <input className="input-field" type="date" value={form.dob} onChange={set('dob')} max={today} />
        </div>
      </div>

      {/* Email */}
      <div>
        <label style={label}>Email Address</label>
        <input className="input-field" type="email" value={form.email} onChange={set('email')}
          placeholder="you@example.com" autoComplete="email" />
      </div>

      {/* Mobile */}
      <div>
        <label style={label}>Mobile Number</label>
        <input className="input-field" type="tel" value={form.mobile} onChange={set('mobile')}
          placeholder="+1 (555) 000-0000" autoComplete="tel" />
      </div>

      {/* Password + strength */}
      <div>
        <label style={label}>Create Password</label>
        <input className="input-field" type="password" value={form.password} onChange={set('password')}
          placeholder="Min. 8 characters" autoComplete="new-password" />
        <PasswordStrengthBar password={form.password} />
      </div>

      {/* Confirm password */}
      <div>
        <label style={label}>Re-enter Password</label>
        <input className={`input-field ${confirmState}`} type="password" value={form.confirm} onChange={set('confirm')}
          placeholder="Repeat your password" autoComplete="new-password" />
        {confirmState === 'error' && (
          <p className="fade-in" style={{ color: '#FF4D6A', fontSize: 12, marginTop: 4, fontWeight: 500 }}>
            Passwords don't match
          </p>
        )}
      </div>

      <ErrorBanner message={error} shakeKey={shake} />

      <button type="submit" disabled={loading} className="btn-primary" style={{
        width: '100%', padding: '13px 0', borderRadius: 12, color: '#fff',
        fontWeight: 700, fontSize: 14, border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      }}>
        {loading ? <><Spinner /> Creating account…</> : 'Create Account'}
      </button>

      <p style={{ textAlign: 'center', fontSize: 13, color: '#7A90B3', margin: 0 }}>
        Already have an account?{' '}
        <button type="button" onClick={() => onSwitch('login')} style={{
          background: 'none', border: 'none', color: '#1E6FFF', fontWeight: 700,
          cursor: 'pointer', padding: 0, fontSize: 13, textDecoration: 'underline',
        }}>Sign in</button>
      </p>
    </form>
  );
}

/* ─── Dashboard ────────────────────────────────────────────── */
function Dashboard({ user, onSignOut }) {
  const firstName = (user.fullName || user.username).split(' ')[0];
  const initial   = firstName.charAt(0).toUpperCase();

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20 }}>

      {/* Avatar */}
      <div style={{
        width: 80, height: 80, borderRadius: '50%', display: 'flex',
        alignItems: 'center', justifyContent: 'center', color: '#fff',
        fontSize: 32, fontWeight: 800,
        background: 'linear-gradient(135deg, #1E6FFF 0%, #0B50CC 100%)',
        boxShadow: '0 8px 24px rgba(30,111,255,0.35)',
      }}>{initial}</div>

      {/* Welcome */}
      <div style={{ textAlign: 'center' }}>
        <h2 style={{ margin: 0, fontSize: 22, fontWeight: 800, color: '#0B1E3F' }}>
          Welcome back, {firstName}!
        </h2>
        <p style={{ margin: '6px 0 0', fontSize: 13, color: '#7A90B3' }}>{user.email}</p>
      </div>

      {/* Member badge */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 7,
        padding: '8px 18px', borderRadius: 999, color: '#fff',
        fontSize: 12, fontWeight: 700,
        background: 'linear-gradient(135deg, #1E6FFF 0%, #0B50CC 100%)',
        boxShadow: '0 2px 12px rgba(30,111,255,0.3)',
      }}>
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20">
          <path fillRule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/>
        </svg>
        AgentFlow AI Member
      </div>

      {/* Divider */}
      <div style={{ width: '100%', height: 1, background: '#E8F0FB' }} />

      {/* Stats */}
      <div style={{ width: '100%', display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
        {[['Agents','0'],['Workflows','0'],['Runs','0']].map(([label, val]) => (
          <div key={label} style={{
            background: '#F4F8FF', borderRadius: 12, padding: '14px 8px', textAlign: 'center',
          }}>
            <p style={{ margin: 0, fontSize: 20, fontWeight: 800, color: '#0B1E3F' }}>{val}</p>
            <p style={{ margin: '3px 0 0', fontSize: 11, color: '#7A90B3', fontWeight: 600 }}>{label}</p>
          </div>
        ))}
      </div>

      {/* Open Platform */}
      <button onClick={() => alert('Platform coming soon!')} className="btn-primary" style={{
        width: '100%', padding: '13px 0', borderRadius: 12, color: '#fff',
        fontWeight: 700, fontSize: 14, border: 'none', display: 'flex',
        alignItems: 'center', justifyContent: 'center', gap: 8,
      }}>
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Open Platform
      </button>

      {/* Sign Out */}
      <button onClick={onSignOut} style={{
        width: '100%', padding: '12px 0', borderRadius: 12, fontWeight: 700,
        fontSize: 14, border: '2px solid #D8E4F5', background: 'none',
        color: '#7A90B3', cursor: 'pointer', transition: 'all 0.2s',
      }}
        onMouseEnter={e => { e.target.style.borderColor='#FF4D6A'; e.target.style.color='#FF4D6A'; e.target.style.background='rgba(255,77,106,0.05)'; }}
        onMouseLeave={e => { e.target.style.borderColor='#D8E4F5'; e.target.style.color='#7A90B3'; e.target.style.background='none'; }}
      >
        Sign Out
      </button>
    </div>
  );
}

/* ─── Robot SVG fallback logo ──────────────────────────────── */
function RobotLogo() {
  return (
    <div style={{
      width: 90, height: 90, borderRadius: 20,
      background: 'linear-gradient(135deg, #1E6FFF 0%, #0B50CC 100%)',
      boxShadow: '0 8px 28px rgba(30,111,255,0.4)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <svg viewBox="0 0 64 64" fill="none" width="58" height="58">
        {/* Body */}
        <rect x="13" y="22" width="38" height="30" rx="9" fill="rgba(255,255,255,0.15)" stroke="white" strokeWidth="2"/>
        {/* Eyes */}
        <circle cx="23" cy="35" r="6" fill="white"/>
        <circle cx="41" cy="35" r="6" fill="white"/>
        <circle cx="23" cy="35" r="2.5" fill="#1E6FFF"/>
        <circle cx="41" cy="35" r="2.5" fill="#1E6FFF"/>
        {/* Smile */}
        <path d="M25 45 Q32 50 39 45" stroke="white" strokeWidth="2" strokeLinecap="round" fill="none"/>
        {/* Head antenna */}
        <rect x="28" y="12" width="8" height="10" rx="3" fill="rgba(255,255,255,0.85)"/>
        <circle cx="32" cy="10" r="3" fill="rgba(255,255,255,0.9)"/>
        {/* Arms */}
        <rect x="6" y="28" width="7" height="12" rx="3.5" fill="rgba(255,255,255,0.55)"/>
        <rect x="51" y="28" width="7" height="12" rx="3.5" fill="rgba(255,255,255,0.55)"/>
      </svg>
    </div>
  );
}

/* ─── Auth Card ────────────────────────────────────────────── */
function AuthCard() {
  const [tab, setTab]             = useState('login');
  const [currentUser, setCurrentUser] = useState(null);
  const [userStore, setUserStore] = useState(SEED_USERS);

  const handleLogin  = u => setCurrentUser(u);
  const handleSignup = u => { setUserStore(p => [...p, u]); setCurrentUser(u); };
  const handleSignOut = () => { setCurrentUser(null); setTab('login'); };

  const [logoError, setLogoError] = useState(false);

  return (
    <div className="card-animate" style={{
      width: '100%', maxWidth: 440, background: '#fff',
      borderRadius: 28, margin: '0 16px',
      boxShadow: '0 20px 60px rgba(11,30,63,0.35), 0 4px 24px rgba(30,111,255,0.12)',
      padding: '40px 36px 36px',
    }}>

      {/* ── Header ── */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 24 }}>
        <div style={{ width: 120, height: 120, marginBottom: 12 }}>
          <img
            src="public/assets/logo.png"
            alt="AgentFlow AI"
            style={{
              width: 120, height: 120, objectFit: 'contain', display: 'block',
              filter: 'drop-shadow(0 6px 16px rgba(30,111,255,0.35))',
            }}
            onError={(e) => { e.target.style.display = 'none'; }}
          />
        </div>

        <h1 style={{
          margin: '14px 0 4px',
          fontSize: 24, fontWeight: 800, letterSpacing: '-0.5px',
          background: 'linear-gradient(135deg, #1E6FFF 0%, #0B50CC 100%)',
          WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
        }}>AgentFlow AI</h1>

        <p style={{ margin: 0, fontSize: 10, fontWeight: 700, letterSpacing: '0.18em',
          textTransform: 'uppercase', color: '#7A90B3' }}>
          Multi-Agent Platform
        </p>
      </div>

      {/* ── Tabs ── */}
      {!currentUser && (
        <div role="tablist" style={{
          display: 'flex', background: '#F4F8FF',
          borderRadius: 999, padding: 4, marginBottom: 24,
        }}>
          {[['login','Sign In'],['signup','Sign Up']].map(([id, label]) => (
            <button key={id} role="tab" aria-selected={tab === id}
              onClick={() => setTab(id)}
              className={tab === id ? 'tab-active' : ''}
              style={{
                flex: 1, padding: '9px 0', borderRadius: 999, border: 'none',
                fontSize: 13, fontWeight: 700, cursor: 'pointer',
                background: tab === id ? '#fff' : 'transparent',
                color: tab === id ? '#1E6FFF' : '#7A90B3',
                transition: 'all 0.2s',
              }}>
              {label}
            </button>
          ))}
        </div>
      )}

      {/* ── Content ── */}
      {currentUser ? (
        <Dashboard user={currentUser} onSignOut={handleSignOut} />
      ) : tab === 'login' ? (
        <LoginForm onLogin={handleLogin} onSwitch={setTab} userStore={userStore} />
      ) : (
        <SignupForm onSignup={handleSignup} onSwitch={setTab} userStore={userStore} />
      )}
    </div>
  );
}

/* ─── App root ─────────────────────────────────────────────── */
function App() {
  return (
    <div style={{
      minHeight: '100vh', display: 'flex', alignItems: 'center',
      justifyContent: 'center', padding: '32px 0',
      background: 'linear-gradient(145deg, #0B1E3F 0%, #112060 55%, #0D2875 100%)',
      position: 'relative', overflow: 'hidden',
    }}>
      {/* Ambient glow blobs */}
      <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
        <div style={{
          position: 'absolute', top: -120, left: -120,
          width: 380, height: 380, borderRadius: '50%',
          background: '#1E6FFF', opacity: 0.18, filter: 'blur(80px)',
        }}/>
        <div style={{
          position: 'absolute', bottom: -160, right: -160,
          width: 520, height: 520, borderRadius: '50%',
          background: '#0B50CC', opacity: 0.12, filter: 'blur(100px)',
        }}/>
      </div>
      <AuthCard />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
