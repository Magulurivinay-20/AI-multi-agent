spring.application.name=backend

# Database — default to local in-memory H2 so the app runs without external DB setup.
# Production or Docker-hosted deployments can still override via DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ai_multi_agent;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate — auto-create/update tables (safe for local dev and managed DBs)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Connection pool — important for cloud DB with idle timeouts
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

server.port=${PORT:9090}

# Gemini API key
gemini.api.key=${GEMINI_API_KEY:}

# CORS — set to your Vercel frontend URL in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
